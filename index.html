<style>
  @font-face {
    font-family: 'Cabin Mono';
    src: url('fonts/CabinMono-Regular.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: 'Cabin Mono';
    src: url('fonts/CabinMono-Bold.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
  }
  /* Kanagawa Wave, dark */
  :root {
    --bg: #1f1f28;         /* sumiInk3 */
    --ink: #dcd7ba;        /* fujiWhite */
    --muted: #727169;      /* fujiGray */
    --link: #7e9cd8;       /* crystalBlue */
    --accent: #7fb4ca;     /* springBlue */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.7 'Cabin Mono', monospace;
    max-width: 720px;
    margin: 0 auto;
    padding: 4rem 1.5rem 3rem;
  }
  h1 {
    font-size: 2.4rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 2rem;
  }
  p.intro { margin-bottom: 1.5rem; }
  .things p { margin-bottom: 0.4rem; }
  a {
    color: var(--link);
    text-decoration-color: var(--accent);
    text-decoration-thickness: 2px;
    text-underline-offset: 3px;
  }
  a:hover { color: var(--accent); }
  h2 {
    font-size: 1rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 3.5rem 0 1rem;
  }
  .links { display: flex; gap: 1rem; }
  .links a { color: var(--ink); }
  .links a:hover { color: var(--accent); }
  .links svg { width: 26px; height: 26px; display: block; }
</style>
